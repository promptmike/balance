<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balance</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Balance</h1>
    <div class="scale">
      <div class="stand" aria-hidden="true"></div>
      <div class="beam">
        <section class="plate numerator" id="left">
          <h2>Left top</h2>
          <div class="marbles" tabindex="0" role="group" aria-label="Left top stacks"></div>
        </section>
        <section class="plate numerator" id="right">
          <h2>Right top</h2>
          <div class="marbles" tabindex="0" role="group" aria-label="Right top stacks"></div>
        </section>
        <section class="plate denominator" id="left-bottom">
          <h2>Left bottom</h2>
          <div class="marbles" tabindex="0" role="group" aria-label="Left bottom stacks"></div>
        </section>
        <section class="plate denominator" id="right-bottom">
          <h2>Right bottom</h2>
          <div class="marbles" tabindex="0" role="group" aria-label="Right bottom stacks"></div>
        </section>
      </div>
    </div>
    <output id="result" aria-live="polite">Left 0 = 0 Right</output>
    <section id="tray">
      <h2>Marble tray</h2>
      <div class="marbles"></div>
    </section>
  </main>
  <script src="./multiplication.js"></script>
  <script src="./scripts.js"></script>
</body>
</html>
