<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balance</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Balance</h1>
    <p>Drag marbles between the tray and the two plates. The number on each marble is its weight.</p>
    <div class="scale">
      <div class="stand" aria-hidden="true"></div>
      <div class="beam">
        <section class="plate" id="left">
          <h2>Left plate</h2>
          <div class="marbles"></div>
        </section>
        <section class="plate" id="right">
          <h2>Right plate</h2>
          <div class="marbles"></div>
        </section>
      </div>
    </div>
    <output id="result" aria-live="polite">Left 0 = 0 Right</output>
    <section id="tray">
      <h2>Marble tray</h2>
      <div class="marbles"></div>
    </section>
  </main>
  <script src="./scripts.js"></script>
</body>
</html>
